<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hostel Management System - Register</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Hostel Management System</h1>

            <h2>Create Account</h2>

            <p class="subtitle">
                Register as a student
            </p>


            <form id="registerForm">

                <div class="form-group">

                    <label for="full_name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="student_id">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="student_id"
                        placeholder="Enter your student ID"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Create Account
                </button>


                <p
                    id="registerMessage"
                    class="message"
                ></p>

            </form>


            <p class="switch-auth">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </div>


    <script src="../js/api.js"></script>

    <script src="../js/auth.js"></script>

</body>

</html>
